# 01-standard-runners.yml
#
# Copy to .github/workflows/ in a test repository, then run it by hand from
# the Actions tab (it only has workflow_dispatch, so it never runs on a push).
#
# One job per standard runner label. Each does nothing except print what it
# is, so every job is a few seconds long and every one still costs a whole
# minute — which is the rounding rule we want to see in the payload anyway.
#
# `fail-fast: false` matters. Without it, one unavailable runner cancels the
# rest of the matrix and you lose the whole capture.
#
# `continue-on-error: true` matters for the same reason. Some of these labels
# may not exist any more, or may not be available to your plan. We WANT to
# see what happens then — a job that never starts is dimension E6.

name: Probe · standard runners

on:
  workflow_dispatch:

jobs:
  standard:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner:
          # Linux 1-core x64 — actions_linux_slim — $0.002
          # CONFIRMED REAL on 2026-09-12. It was our one invented label.
          - ubuntu-slim
          # Linux 2-core x64 — actions_linux — $0.006
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-26.04            # public preview
          # Linux 2-core arm64 — actions_linux_arm — $0.005
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - ubuntu-26.04-arm        # public preview
          # Windows 2-core x64 — actions_windows — $0.010
          - windows-latest
          - windows-2025
          - windows-2022
          # Windows 2-core arm64 — actions_windows_arm — $0.010
          - windows-11-arm
          - windows-11-vs2026-arm
          # macOS 4-core Intel — actions_macos — $0.062
          - macos-15-intel
          - macos-26-intel
          # macOS 3-core M1 arm64 — actions_macos — $0.062
          - macos-latest
          - macos-14
          - macos-15
          - macos-26
          - xcode-27                # public preview
    steps:
      - name: Say what this is
        shell: bash
        run: |
          echo "runner label : ${{ matrix.runner }}"
          echo "os           : $RUNNER_OS"
          echo "arch         : $RUNNER_ARCH"
          echo "name         : $RUNNER_NAME"
          echo "environment  : $RUNNER_ENVIRONMENT"

  # QUESTION 4 IS CLOSED. `ubuntu-slim` ran on 2026-09-12 and is now in the
  # matrix above with everything else. The separate "is this label even real"
  # job that used to sit here has been deleted.
  #
  # WHAT CHANGED ON 2026-09-12, and why it is worth reading before editing
  # this list again.
  #
  # This file started with 13 labels. GitHub's own runner table lists TWENTY.
  # Apsareena checked the documentation against the file and found the gap —
  # *"only 13 runners? here in the documentation i see more right?"* — and she
  # was right. Six were missing: ubuntu-26.04, ubuntu-26.04-arm,
  # windows-11-vs2026-arm, macos-26, macos-26-intel and xcode-27.
  #
  # Our RATE TABLE already had all twenty. Only the test was short. So the
  # lesson is not "the table was wrong", it is: **a test built from a list is
  # only as complete as the list was on the day it was written.** GitHub adds
  # runner labels; the public-preview ones especially.
  #
  # When re-reading GitHub's table, count the rows against
  # `STANDARD_RUNNER_RATES` in src/lib/cost/pricing-data.ts. They should match
  # in BOTH directions. As of 2026-09-12 the only entry we hold that GitHub no
  # longer lists is `windows-2025-vs2026` — harmless, it simply never matches.
